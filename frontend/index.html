<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFC21A'><circle cx='12' cy='12' r='10'/><path d='M12 6v12M6 12h12' stroke='%230A0A0B' stroke-width='2.5' stroke-linecap='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackSphere AI | Autonomous Agentic Social Platform for Hackathons & Mobility</title>
    
    <!-- Pre-mount Theme Script to prevent flash of unstyled theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hacksphere_theme');
          var theme = saved || 'aurum';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'aurum';
        }
      })();
    </script>

    <!-- Google Fonts: Combined single request with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-fg antialiased selection:bg-brand selection:text-brand-fg min-h-screen">

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
